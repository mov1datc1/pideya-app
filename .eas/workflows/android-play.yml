name: Cliente Android - Google Play interno

# Ejecución manual mientras Google Play se configura. Sin envío automático al hacer push.

jobs:
  validate:
    name: Validar cliente
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Comprobar variables de compilacion
        run: |
          node -e 'const required = ["EXPO_PUBLIC_SUPABASE_URL", "EXPO_PUBLIC_SUPABASE_ANON_KEY", "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY"]; const missing = required.filter(key => !process.env[key]?.trim()); if (missing.length) { console.error("Faltan variables EAS production: " + missing.join(", ")); process.exit(1); }'
      - name: Comprobar TypeScript
        run: npx tsc --noEmit
      - name: Pruebas de regresion
        run: node --test tests/*.test.cjs
      - name: Comprobar compatibilidad Expo
        run: npx --yes expo-doctor@1.21.5

  build_android:
    name: Compilar AAB
    needs: [validate]
    type: build
    params:
      platform: android
      profile: production

